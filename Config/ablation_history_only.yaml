data:
  root: train_data/scheme_a_glm_sequences
  history_length: 60
  prediction_length: 18
  train_end: "2026-03-31"
  val_end: "2026-04-30"

model:
  model_dim: 128
  encoder_layers: 2
  decoder_layers: 3
  heads: 4
  mlp_ratio: 4
  dropout: 0.1

diffusion:
  timesteps: 500
  sampling_timesteps: 50
  loss_type: l1
  fourier_weight: null
  ddim_eta: 0.0
  target_mode: residual
  residual_scale: 2.0
  condition_mode: zero

train:
  output_dir: outputs/ablation_history_only
  device: auto
  seed: 42
  batch_size: 64
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  max_steps: 10000
  log_every: 100
  validate_every: 500
  validation_batches: 50
  save_every: 1000
  amp: false
